# constraints.yaml — machine-readable engineering constraints
# CANONICAL SOURCE for regex patterns and numeric thresholds. Enforcement
# scripts read from here at runtime; do not hardcode duplicates.
# Generated by eng-init. See AGENTS.md § Enforcement Index.

# ── Strictness Profile ─────────────────────────────────────────
strictness_profile:
  schema_version: "3.5.8"
  level: "L3"                        # L1 prototype | L2 standard | L3 strict | L4 maximal
  chosen_by_user: true               # Q1.4 answered explicitly (L3, agent-heavy adjustment)
  downgrades:
    # L3 profile-blocked limits that are NOT machine-enforced in this repo —
    # recorded honestly as review-only rather than falsely claimed as blocking.
    # These are tool-availability gaps, not user relaxations; all are repo-correctable
    # (add a complexity gate / commitlint / PR CI) without changing the profile.
    # size_limits.max_file_lines is NOT listed: converted review-only → block in f3
    # (just size-gate + tokei wired into just check; removal trigger fulfilled).
    - control: testing.min_line_coverage
      profile_default: block (80)
      chosen: review-only
      reason: "llvm-cov is a slow instrumented build unsuitable for pre-commit/just-check; empty scaffold has nothing to measure until the first product commit lands"
      removal_trigger: "first product commit (t0/event/fold) lands real code; then wire coverage into just check and promote to block"
    - control: size_limits.max_complexity
      profile_default: block (15)
      chosen: review-only
      reason: "clippy::cognitive_complexity is allow-by-default; not gated"
      removal_trigger: "add clippy::cognitive_complexity to -D warnings in just lint"
    - control: size_limits.max_function_lines
      profile_default: block (150)
      chosen: review-only
      reason: "clippy too_many_lines not gated at -D warnings"
      removal_trigger: "add clippy::too_many_lines to -D warnings in just lint"
    - control: size_limits.max_pr_diff_lines
      profile_default: block (400)
      chosen: review-only
      reason: "no remote PR CI (single-user local repo); review checklist only"
      removal_trigger: "set up remote CI (GitHub Actions) and add a diff-size guard step"
    - control: commits.conventional_commits_required
      profile_default: block
      chosen: review-only
      reason: "commitlint not installed"
      removal_trigger: "install commitlint and wire into .git-hooks/commit-msg"
    - control: anti_drift.duplicate_code_threshold_percent
      profile_default: block (3)
      chosen: review-only
      reason: "no Rust duplicate-code detector installed"
      removal_trigger: "install a Rust duplicate-code detector (e.g. SonarQube, manual review→tool)"
    - control: anti_drift.dead_code_min_confidence
      profile_default: block (80)
      chosen: review-only
      reason: "cargo-machete not installed"
      removal_trigger: "install cargo-machete or cargo-udeps and wire into just lint"
  # Every row above stays L3-profile-valid; the gate is the honest gap, not a
  # silent relaxation. Re-eng-init or add tooling to convert review-only→block.

