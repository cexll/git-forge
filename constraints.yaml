# ── Code Canonicality ──────────────────────────────────────────
code_canonicality:
  forbidden_suffixes:
    description: "Filenames/identifiers matching these patterns are rejected at commit"
    patterns:
      - "_v[0-9]+"
      - "_new"
      - "_old"
      - "_backup"
      - "_temp"
      - "_copy"
      - "_final"
      - "_real"
      - "_improved"
      - "_refactored"
      - "_fixed"
      - "_legacy"
      - "_deprecated"
    enforced_by: ".git-hooks/check-naming.sh"
  scratchpad_directories:
    description: "Directories that must never appear in commits"
    paths: [tmp, scratch, backup, _old, deprecated, archive, wip]
    enforced_by: ".git-hooks/check-naming.sh + .gitignore"

# ── Size Limits (L3) ───────────────────────────────────────────
# Honest severity: clippy -D warnings blocks; file-line count is now
# machine-enforced by just size-gate (tokei, wired into just check). Complexity
# and function-line limits remain review-only — clippy::cognitive_complexity /
# too_many_lines are not gated.
size_limits:
  max_file_lines:
    value: 800
    severity: "block"              # machine-enforced: tokei required prereq (brew) + just size-gate wired into just check
    enforced_by: "just size-gate (tokei)"
  max_complexity:
    value: 15
    severity: "review-only"          # clippy::cognitive_complexity is allow-by-default; not gated
    enforced_by: "PR review only (no gate wired)"
  max_function_lines:
    value: 150
    severity: "review-only"          # clippy too_many_lines non-gated
    enforced_by: "PR review only (no gate wired)"
  max_pr_diff_lines:
    value: 400
    severity: "review-only"          # no remote PR CI
    enforced_by: "review checklist (review-only)"

# ── Test Discipline ─────────────────────────────────────────────
testing:
  min_line_coverage:
    value: 80
    scope: "global"                  # per-file 100% strong form not elected (L3 optional)
    severity: "review-only"          # downgraded from block — see strictness_profile.downgrades
    enforced_by: "just coverage (cargo llvm-cov --fail-under-lines 80); standalone until qualified"
  tdd_mode:
    value: "required"
    description: "Every production change ships with a failing test first (Q4.1 = required)"
  forbid_mock_of_system_under_test:
    value: true
    description: "Mock dependencies, never the system under test"

# ── Dependency Rules ───────────────────────────────────────────
dependencies:
  new_dependency_requires_justification:
    value: true
    description: "PR/feature receipt must explain why existing tools cannot do the job"
  allowed_licenses:
    value: ["MIT"]
    enforced_by: "PR review (review-only; no license audit tool installed)"

# ── Anti-Drift ─────────────────────────────────────────────────
anti_drift:
  duplicate_code_threshold_percent:
    value: 3
    severity: "review-only"          # no Rust duplicate-code detector installed — honest gap
    enforced_by: "PR review only (no tool wired)"
  dead_code_min_confidence:
    value: 80
    severity: "review-only"          # cargo-machete not installed — honest gap
    enforced_by: "PR review only (no tool wired)"

# ── Commit Discipline ───────────────────────────────────────────
commits:
  conventional_commits_required:
    value: true
    allowed_types: ["feat", "fix", "refactor", "chore", "docs", "test", "ci", "build", "perf"]
    enforced_by: "PR review (review-only; commitlint not installed)"

# ── Runtime Verification ────────────────────────────────────────
# Machine-readable mirror of the AGENTS.md Verification Matrix. Every command
# resolves to a real justfile target.
verification:
  surfaces:
    unit:
      command: "just unit"
      evidence: "exit-code + test names"
      required_at: "L3"
    test:
      command: "just test"
      evidence: "exit-code + test names (all targets)"
      required_at: "L3"
    e2e:
      command: "just e2e && just dogfood"
      evidence: "exit-code (fails loudly when test files exist but fail); dogfood 45/45 on a disposable clone oracle"
      required_at: "L3"
    cli:
      command: "just verify-cli"
      evidence: "exit-code + stdout"
      required_at: "L2+"
    lint:
      command: "just lint"
      evidence: "exit-0 (clippy -D warnings)"
      required_at: "L3"
    fmt:
      command: "just fmt-check"
      evidence: "exit-0 (cargo fmt --check)"
      required_at: "L3"
    coverage:
      command: "just coverage"
      evidence: "llvm-cov >= 80% lines; unqualified until t0 coverage corpus"
      required_at: "review-only"    # downgraded — see strictness_profile.downgrades
      level: "review-only"
    guardrails:
      command: "just test-guardrails"
      evidence: "3/3 guard assertions pass; wired into just check (block)"
      required_at: "L3"
      level: "block"
    decisions:
      command: "just decisions-check"
      evidence: "structural verify of docs/decisions tree; wired into just check (block)"
      required_at: "L3"
      level: "block"
    size:
      command: "just size-gate"
      evidence: "tokei json over src/; exit 0 iff every src/ file <= 800 code lines; wired into just check (block)"
      required_at: "L3"
      level: "block"
  enforced_by: "Stage 4 matrix-to-target check over constraints.yaml + AGENTS.md Verification Matrix"

# ── Exemptions ──────────────────────────────────────────────────
exemptions:
  entries: []

# ── Violation Baseline (Q1.4b = fix-now) ────────────────────────
baseline:
  mode: "fix-now"                    # t0 pack clippy/fmt violations fixed during eng-init
  rev: "23f4684"                     # commit before the fix; counts now 0
  counts:
    duplicate_code: 0
    dead_code: 0
    size_violations: 0
    coverage_gap: 0
  enforced_by: "no CI baseline step needed — all counts 0 (fix-now disposition)"

# ── Rehabilitation State ────────────────────────────────────────
rehabilitation:
  active: false
  phase: "none"
  baseline_frozen: false
  command_entrypoint: "just check"
  runtime_verifier: ""
  broad_refactor_allowed: false
  work_unit_protocol: "none"
  readiness_gaps: []
  enforced_by: "not active"

# ── Refactor Contract ───────────────────────────────────────────
# Not rendered: no large-refactor overlay (devflow features are new
# construction, not a port/rewrite of an existing surface).
