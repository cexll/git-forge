# constraints.yaml — machine-readable engineering constraints
# CANONICAL SOURCE for regex patterns and numeric thresholds. Enforcement
# scripts read from here at runtime; do not hardcode duplicates.
# Generated by eng-init. See AGENTS.md § Enforcement Index.

# ── Strictness Profile ─────────────────────────────────────────
strictness_profile:
  schema_version: "3.5.8"
  level: "L3"                        # L1 prototype | L2 standard | L3 strict | L4 maximal
  chosen_by_user: true               # Q1.4 answered explicitly (L3, agent-heavy adjustment)
  downgrades:
    # L3 profile-blocked limits that are NOT machine-enforced in this repo —
    # recorded honestly as review-only rather than falsely claimed as blocking.
    # These are tool-availability gaps, not user relaxations; all are repo-correctable
    # (add a PR CI / commitlint) without changing the profile.
    # NOT listed (converted review-only → block): size_limits.max_file_lines (just
    # size-gate), size_limits.max_complexity + max_function_lines (clippy
    # ::cognitive_complexity / ::too_many_lines at -D warnings), anti_drift.dead_code
    # (rustc dead_code under -D warnings + cargo-machete for unused deps).
    - control: testing.min_line_coverage
      profile_default: block (94)
      chosen: review-only
      reason: "llvm-cov is a slow instrumented build (~50s) unsuitable for pre-commit/just-check, and there is no CI runner to host it as a blocking gate; it stays a standalone review-only check for single-user local dev"
      removal_trigger: "a CI runner (or equivalent) is wired to run `just coverage` as a blocking aggregate gate — not the first product commit, which has long since landed"
    - control: size_limits.max_pr_diff_lines
      profile_default: block (400)
      chosen: review-only
      reason: "no remote PR CI (single-user local repo); review checklist only"
      removal_trigger: "set up remote CI (GitHub Actions) and add a diff-size guard step"
    - control: commits.conventional_commits_required
      profile_default: block
      chosen: review-only
      reason: "commitlint not installed"
      removal_trigger: "install commitlint and wire into .git-hooks/commit-msg"
    - control: anti_drift.duplicate_code_threshold_percent
      profile_default: block (3)
      chosen: review-only
      reason: "no Rust duplicate-code detector installed"
      removal_trigger: "install a Rust duplicate-code detector (e.g. SonarQube, manual review→tool)"
  # Every row above stays L3-profile-valid; the gate is the honest gap, not a
  # silent relaxation. Re-eng-init or add tooling to convert review-only→block.

# ── Generated Section Registry ─────────────────────────────────
# Repair mode updates only eng-init-owned sections; user-owned sections preserved.
generated_sections:
  agents_md:
    - title: "Code Canonicality"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Project Identity"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Stack & Versions"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Directory Map"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Development Workflow"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Verification Matrix"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Conventions"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Code Review Self-Check"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Critical Paths"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Agent Operating Rules"
      owner: "eng-init"
      template_version: "3.5.8"
    - title: "Enforcement Index"
      owner: "eng-init"
      template_version: "3.5.8"
  preserve_unknown_sections: true
  backup_policy: ".eng-init/backups/<UTC>/ only when explicitly requested"

# ── Code Canonicality ──────────────────────────────────────────
code_canonicality:
  forbidden_suffixes:
    description: "Filenames/identifiers matching these patterns are rejected at commit"
    patterns:
      - "_v[0-9]+"
      - "_new"
      - "_old"
      - "_backup"
      - "_temp"
      - "_copy"
      - "_final"
      - "_real"
      - "_improved"
      - "_refactored"
      - "_fixed"
      - "_legacy"
      - "_deprecated"
    enforced_by: ".git-hooks/check-naming.sh"
  scratchpad_directories:
    description: "Directories that must never appear in commits"
    paths: [tmp, scratch, backup, _old, deprecated, archive, wip]
    enforced_by: ".git-hooks/check-naming.sh + .gitignore"

# ── Size Limits (L3) ───────────────────────────────────────────
size_limits:
  max_file_lines:
    value: 800
    severity: "block"              # machine-enforced: tokei required prereq (brew) + just size-gate wired into just check
    enforced_by: "just size-gate (tokei)"
  max_complexity:
    value: 15
    severity: "block"          # clippy::cognitive_complexity gated at -D warnings (threshold 15, clippy.toml)
    enforced_by: "just lint + pre-commit: clippy -D clippy::cognitive_complexity"
  max_function_lines:
    value: 150
    severity: "block"          # clippy too_many_lines gated at -D warnings (threshold 150, clippy.toml)
    enforced_by: "just lint + pre-commit: clippy -D clippy::too_many_lines"
  max_pr_diff_lines:
    value: 400
    severity: "review-only"          # no remote PR CI
    enforced_by: "review checklist (review-only)"

# ── Test Discipline ─────────────────────────────────────────────
testing:
  min_line_coverage:
    value: 94
    scope: "global"                  # per-file 100% strong form not elected (L3 optional)
    severity: "review-only"          # downgraded from block — see strictness_profile.downgrades
    enforced_by: "just coverage (cargo llvm-cov --fail-under-lines 94); standalone until qualified"
  tdd_mode:
    value: "required"
    description: "Every production change ships with a failing test first (Q4.1 = required)"
  forbid_mock_of_system_under_test:
    value: true
    description: "Mock dependencies, never the system under test"

# ── Dependency Rules ───────────────────────────────────────────
dependencies:
  new_dependency_requires_justification:
    value: true
    description: "PR/feature receipt must explain why existing tools cannot do the job"
  allowed_licenses:
    value: ["MIT"]
    enforced_by: "PR review (review-only; no license audit tool installed)"

# ── Anti-Drift ─────────────────────────────────────────────────
anti_drift:
  duplicate_code_threshold_percent:
    value: 3
    severity: "review-only"          # no Rust duplicate-code detector installed — honest gap
    enforced_by: "PR review only (no tool wired)"
  dead_code_min_confidence:
    value: 80
    severity: "block"                # within-crate dead code via rustc dead_code under clippy -D warnings; unused deps via cargo-machete
    enforced_by: "just lint + pre-commit (rustc dead_code under -D warnings) + just deps-check (cargo machete)"

# ── Commit Discipline ───────────────────────────────────────────
commits:
  conventional_commits_required:
    value: true
    allowed_types: ["feat", "fix", "refactor", "chore", "docs", "test", "ci", "build", "perf"]
    enforced_by: "PR review (review-only; commitlint not installed)"

# ── Runtime Verification ────────────────────────────────────────
# Machine-readable mirror of the AGENTS.md Verification Matrix. Every command
# resolves to a real justfile target.
verification:
  surfaces:
    unit:
      command: "just unit"
      evidence: "exit-code + test names"
      required_at: "L3"
    test:
      command: "just test"
      evidence: "exit-code + test names (all targets)"
      required_at: "L3"
    e2e:
      command: "just e2e"
      evidence: "exit-code; runs both 45/45 dogfood oracles (master-default + main-default) plus the SEC-01 eval-injection regression on disposable clones; fails loudly on any oracle failure"
      required_at: "L3"
    cli:
      command: "just verify-cli"
      evidence: "exit-code + stdout"
      required_at: "L2+"
    lint:
      command: "just lint"
      evidence: "exit-0 (clippy -D warnings, incl. clippy::cognitive_complexity + too_many_lines at clippy.toml thresholds)"
      required_at: "L3"
    fmt:
      command: "just fmt-check"
      evidence: "exit-0 (cargo fmt --check)"
      required_at: "L3"
    coverage:
      command: "just coverage"
      evidence: "llvm-cov >= 94% lines; standalone review-only (slow instrumented build; no CI runner)"
      required_at: "review-only"    # downgraded — see strictness_profile.downgrades
      level: "review-only"
    guardrails:
      command: "just test-guardrails"
      evidence: "5/5 guard assertions pass (incl. size-gate hostile-config regression); wired into just check (block)"
      required_at: "L3"
      level: "block"
    decisions:
      command: "just decisions-check"
      evidence: "structural verify of docs/decisions tree; wired into just check (block)"
      required_at: "L3"
      level: "block"
    size:
      command: "just size-gate"
      evidence: "tokei json over src/; exit 0 iff every src/ file <= 800 code lines; wired into just check (block)"
      required_at: "L3"
      level: "block"
    deps:
      command: "just deps-check"
      evidence: "cargo-machete exits 0 (no unused [dependencies] entry); wired into just check (block)"
      required_at: "L3"
      level: "block"
    harness:
      command: "just harness-check"
      evidence: "check_rendered_harness.py exits 0 — AGENTS.md required sections, Verification Matrix commands, Enforcement Index paths, and the constraints.yaml verification mirror all resolve"
      required_at: "L3"
      level: "block"
    docs:
      command: "just docs-check"
      evidence: "check_docs.py exits 0 — wire-contract Known Limitations present and doc cross-references resolve to real files"
      required_at: "L3"
      level: "block"
  enforced_by: "Stage 4 matrix-to-target check over constraints.yaml + AGENTS.md Verification Matrix"

# ── Exemptions ──────────────────────────────────────────────────
exemptions:
  entries: []

# ── Violation Baseline (Q1.4b = fix-now) ────────────────────────
baseline:
  mode: "fix-now"                    # t0 pack clippy/fmt violations fixed during eng-init
  rev: "23f4684"                     # commit before the fix; counts now 0
  counts:
    duplicate_code: 0
    dead_code: 0
    size_violations: 0
    coverage_gap: 0
  lint_allow:
    # Scoped `#[allow]` baseline exemptions: the repo's clippy thresholds are now
    # enforced at -D warnings (size_limits), and these are the only legacy
    # violations. Each names the refactor that closes it; delete the #[allow]
    # and this entry together when the function is split / scenario broken up.
    - control: clippy::too_many_lines
      target: "src/pr_merge.rs::cmd_pr_merge"
      reason: "single 240-line merge orchestration boundary; splitting into step helpers is a critical-path refactor"
      removal_trigger: "cmd_pr_merge split below 150 lines (then delete the #[allow] and this entry)"
    - control: clippy::cognitive_complexity
      target: "tests/t2_pr.rs::pr_create_show_snapshot"
      reason: "long branchy PR-create scenario test (16 > 15)"
      removal_trigger: "break the scenario into helper fns (then delete the #[allow] and this entry)"
    - control: clippy::cognitive_complexity
      target: "tests/t3_merge.rs::worktree_removal_failure_reports_and_cleans_pending_ref"
      reason: "long worktree-removal failure-path scenario test (16 > 15)"
      removal_trigger: "break the scenario into helper fns (then delete the #[allow] and this entry)"
    - control: clippy::cognitive_complexity
      target: "tests/t3_merge.rs::seam_lock_failure_releases_lock_and_cleans_pending_ref"
      reason: "long seam-lock failure-path scenario test (17 > 15)"
      removal_trigger: "break the scenario into helper fns (then delete the #[allow] and this entry)"
  enforced_by: "no CI baseline step needed — all counts 0 (fix-now disposition)"

# ── Rehabilitation State ────────────────────────────────────────
rehabilitation:
  active: false
  phase: "none"
  baseline_frozen: false
  command_entrypoint: "just check"
  runtime_verifier: ""
  broad_refactor_allowed: false
  work_unit_protocol: "none"
  readiness_gaps: []
  enforced_by: "not active"

